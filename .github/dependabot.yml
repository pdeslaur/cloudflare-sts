version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "npm"
    directory: "/crates/cloudflare-sts-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-npm:
        patterns: ["*"]
    # Not auto-merged: npm, cargo and Go updates bring in code nobody here has
    # read, so a person merges them.
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "npm"
    directory: "/crates/cloudflare-sts-sdk/openapi"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-npm:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "terraform"
    directory: "/modules/api"
    schedule:
      interval: "weekly"
    groups:
      all-terraform:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "auto-merge"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The integration tests seed rsa 0.9's key generation with rand_chacha,
      # which must implement the rand_core rsa does: 0.6, so rand_chacha 0.3.
      # Move both together, once rsa moves to a newer rand_core.
      - dependency-name: "rand_chacha"
        versions: [">= 0.4"]
    open-pull-requests-limit: 10
    groups:
      all-cargo:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      all-go:
        patterns: ["*"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
