name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      # Incremental builds only make the cache bigger in CI.
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      # The dev shell's store paths, so the Rust toolchain and the tools are
      # fetched again only when the flake or the toolchain changes.
      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # Cargo's downloads and build outputs. A new Cargo.lock starts from the
      # last build with the same toolchain.
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-
      # The OpenAPI document is compiled from TypeSpec and checked in, so it
      # must be what the .tsp compiles to.
      - name: Check OpenAPI Document
        working-directory: crates/cloudflare-sts-sdk/openapi
        run: |
          nix develop --command npm ci
          nix develop --command npm run generate
          git diff --exit-code .
      - name: Check Rust Formatting
        run: nix develop --command cargo fmt --all --check
      - name: Test Rust
        run: nix develop --command cargo test --workspace
      - name: Build Rust Worker
        working-directory: crates/cloudflare-sts-api
        run: nix develop --command worker-build --release
      # The Worker's flows end to end, under wrangler dev, against the tests'
      # stand-ins for the OIDC issuers and Cloudflare.
      - name: Integration Test Rust Worker
        run: nix develop --command crates/cloudflare-sts-api/tests/run.sh
      - name: Validate Terraform Module
        working-directory: deployment/terraform
        run: |
          nix develop --command tofu fmt -check -recursive
          nix develop --command tofu init -backend=false
          nix develop --command tofu validate
          nix develop --command tofu test

  release:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for octo-sts
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # release-please opens its pull request with an octo-sts token rather
      # than GITHUB_TOKEN, so that it triggers CI. The
      # .github/chainguard/release.sts.yaml trust policy grants it.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: release
      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main
          token: ${{ steps.octo-sts.outputs.token }}

  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
      # The caches the test job saved on main.
      - name: Restore Nix Store
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust-toolchain.toml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Restore Cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml') }}-
      # The Worker as deployment/terraform uploads it: worker-build's index.js, and
      # the wasm as base64 text, so Terraform can check its checksum.
      - name: Build
        working-directory: crates/cloudflare-sts-api
        run: |
          nix develop --command worker-build --release
          mkdir -p "$RUNNER_TEMP/release"
          cp build/index.js "$RUNNER_TEMP/release/"
          base64 -w0 build/index_bg.wasm > "$RUNNER_TEMP/release/index_bg.wasm.base64"
          cd "$RUNNER_TEMP/release" && sha256sum index.js index_bg.wasm.base64 > SHA256SUMS
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: |
            ${{ runner.temp }}/release/index.js
            ${{ runner.temp }}/release/index_bg.wasm.base64
            ${{ runner.temp }}/release/SHA256SUMS
