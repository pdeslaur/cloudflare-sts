name: Update Flake Locks
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for octo-sts
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The pull request is opened with an octo-sts token rather than
      # GITHUB_TOKEN, so that it triggers CI. The
      # .github/chainguard/update.sts.yaml trust policy grants it.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: update
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Update root flake.lock
        uses: nixos-contrib/nix-update@v1
        with:
          token: ${{ steps.octo-sts.outputs.token }}
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            auto-merge
          commit-msg: "chore(flake): update flake.lock"
